  }

  #bg::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(0,0,0,0.55) 0%, rgba(10,0,25,0.7) 100%);
  }

  .card {
    position: relative; z-index: 1;
    width: min(480px, 96vw);
    background: rgba(5, 2, 18, 0.72);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 32px 28px 28px;
    backdrop-filter: blur(18px);
    box-shadow: 0 8px 48px rgba(0,0,0,0.7), inset 0 0 0 0.5px rgba(255,255,255,0.07);
  }

  h1 {
    text-align: center;
    font-size: 22px;
    font-weight: 500;
    color: #e8e2f4;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  /* Scores */
  .scores {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 28px;
  }
  .score-box {
    flex: 1;
    text-align: center;
    background: rgba(255,255,255,0.06);
    border: 0.5px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    padding: 10px 8px;
  }
  .score-box .lbl {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin-bottom: 4px;
  }
  .score-box .num {
    font-size: 28px;
    font-weight: 600;
    color: #fff;
  }

  /* Arena */
  .arena {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 20px;
  }
  .side {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    flex: 1;
  }
  .side-lbl {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
  }
  .bubble {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 42px;
    transition: transform 0.38s cubic-bezier(.34,1.56,.64,1), background 0.22s;
  }
  .bubble.pop {
    background: rgba(255,255,255,0.16);
    border-color: rgba(255,255,255,0.45);
    transform: scale(1.1);
  }
  .vs { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.3); flex-shrink: 0; }

  /* Result */
  .result {
    text-align: center;
    min-height: 34px;
    font-size: 18px;
    font-weight: 500;
    color: #e8e2f4;
    letter-spacing: 0.02em;
    margin-bottom: 22px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }

  /* Buttons row */
  .btns {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .cbtn {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.09);
    cursor: pointer;
    font-size: 33px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.18s, background 0.18s, border-color 0.18s, box-shadow 0.18s;
    outline: none;
  }
  .cbtn:hover {
    background: rgba(255,255,255,0.2);
    border-color: rgba(255,255,255,0.55);
    transform: scale(1.14) translateY(-3px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
  .cbtn:active { transform: scale(0.95); }
  .cbtn.win { border-color: #6ee7b7; background: rgba(110,231,183,0.18); box-shadow: 0 0 16px rgba(110,231,183,0.3); }
  .cbtn.lose { border-color: #fca5a5; background: rgba(252,165,165,0.14); }

  /* Reset */
  .reset-btn {
    display: block;
    margin: 0 auto;
    padding: 9px 28px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.75);
    font-size: 13px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s;
  }
  .reset-btn:hover {
    background: rgba(255,255,255,0.18);
    border-color: rgba(255,255,255,0.4);
    color: #fff;
  }

  .hint {
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.28);
    margin-top: 14px;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
<div id="bg"></div>

<div class="card">
  <h1>Rock · Paper · Scissors</h1>

  <div class="scores">
    <div class="score-box"><div class="lbl">You</div><div class="num" id="sy">0</div></div>
    <div class="score-box"><div class="lbl">Draw</div><div class="num" id="sd">0</div></div>
    <div class="score-box"><div class="lbl">CPU</div><div class="num" id="sc">0</div></div>
  </div>

  <div class="arena">
    <div class="side">
      <div class="side-lbl">You</div>
      <div class="bubble" id="you-b">🤔</div>
    </div>
    <div class="vs">VS</div>
    <div class="side">
      <div class="side-lbl">CPU</div>
      <div class="bubble" id="cpu-b">🤖</div>
    </div>
  </div>

  <div class="result" id="result">Choose your move!</div>

  <div class="btns">
    <button class="cbtn" id="br" title="Rock" onclick="play('rock')" aria-label="Rock">✊</button>
    <button class="cbtn" id="bp" title="Paper" onclick="play('paper')" aria-label="Paper">🖐</button>
    <button class="cbtn" id="bs" title="Scissors" onclick="play('scissors')" aria-label="Scissors">✌️</button>
  </div>

  <button class="reset-btn" onclick="reset()">↺ Reset Scores</button>
  <div class="hint">✊ Rock &nbsp;·&nbsp; 🖐 Paper &nbsp;·&nbsp; ✌️ Scissors</div>
</div>

<script>
  const CHOICES = ['rock','paper','scissors'];
  const EM = { rock:'✊', paper:'🖐', scissors:'✌️' };
  const BEATS = { rock:'scissors', paper:'rock', scissors:'paper' };
  const MSGS = {
    win: ['You win! 🎉','Nice one! 🏆','You got it! ✨','Crushing it! 💪'],
    lose: ['CPU wins 🤖','Not this time! 😅','CPU takes it!','Better luck next time!'],
    draw: ["It's a draw! 🤝","Tied! Try again 🔄","Great minds! 🧠"]
  };
  const scores = {you:0,draw:0,cpu:0};
  let locked = false;
  const btnMap = {rock:'br',paper:'bp',scissors:'bs'};

  function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function play(choice){
    if(locked) return;
    locked = true;
    const cpu = rand(CHOICES);
    const yb = document.getElementById('you-b');
    const cb = document.getElementById('cpu-b');
    const res = document.getElementById('result');
    document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('win','lose'));
    yb.classList.remove('pop'); cb.classList.remove('pop');
    yb.textContent = '⏳'; cb.textContent = '⏳';
    res.textContent = '...';

    setTimeout(()=>{
      yb.textContent = EM[choice];
      yb.classList.add('pop');
    }, 300);

    setTimeout(()=>{
      cb.textContent = EM[cpu];
      cb.classList.add('pop');
      let r;
      if(choice===cpu) r='draw';
      else if(BEATS[choice]===cpu) r='win';
      else r='lose';
      if(r==='win') scores.you++;
      else if(r==='lose') scores.cpu++;
      else scores.draw++;
      document.getElementById('sy').textContent = scores.you;
      document.getElementById('sd').textContent = scores.draw;
      document.getElementById('sc').textContent = scores.cpu;
      res.textContent = rand(MSGS[r]);
      if(r==='win'){
        document.getElementById(btnMap[choice]).classList.add('win');
        document.getElementById(btnMap[cpu]).classList.add('lose');
      } else if(r==='lose'){
        document.getElementById(btnMap[cpu]).classList.add('win');
        document.getElementById(btnMap[choice]).classList.add('lose');
      }
      setTimeout(()=>{ locked=false; }, 400);
    }, 700);
  }

  function reset(){
    scores.you=0; scores.draw=0; scores.cpu=0;
    document.getElementById('sy').textContent=0;
    document.getElementById('sd').textContent=0;
    document.getElementById('sc').textContent=0;
    document.getElementById('you-b').textContent='🤔';
    document.getElementById('cpu-b').textContent='🤖';
    document.getElementById('you-b').classList.remove('pop');
    document.getElementById('cpu-b').classList.remove('pop');
    document.getElementById('result').textContent='Choose your move!';
    document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('win','lose'));
    locked=false;
  }
</script>
</body>
</html>
